<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title></title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1 minimum-scale=1">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Alumni+Sans+SC:ital,wght@0,100..900;1,100..900&family=Fugaz+One&family=Roboto+Mono:ital,wght@0,100..700;1,100..700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="css/json-style.css">
        <link rel="stylesheet" href="css/fonts.css">
    </head>
    <body class="vertical-flex no-scroll">
        <!--Header-->
        <header id="header">
            <a href="#" id="header-title" class="fugaz-one-regular">JSON:Reader</a>
        </header>

        <p class="instruction-text">Upload a JSON file, then view and edit it!</p>
        <input class="upload-button-initial" type="file" id="json-file-upload" accept=".json">
        <button id="download-button">DOWNLOAD</button>
        <p class="hidden-text">JSON file successfully uploaded! To edit text values, just click</p>

        <section id="json-output" data-name="json-root">
            <!-- Populated with the templates (under the body code) in json-script.js -->
        </section>

        <script src="js/json-script.js"></script>
    </body>


    <!-- Templates go here -->

    <template id="array-template">
        <div class="array-div" data-array>
            <div data-children></div>
        </div>
    </template>

    <template id="object-template">
        <div class="object-div entry-div" data-object>
            <div data-children></div>
        </div>
    </template>

    <template id="key-value-template">
        <div class="kv-div entry-div" data-kv>
            <p class="kv-key roboto-mono-bold" data-name></p>
            <div class="kv-value-container" data-children></div>
        </div>
    </template>

    <template id="value-text-template">
        <p class="kv-value roboto-mono-normal" contenteditable="true" data-text></p>
    </template>

    <template id="value-number-template">
        <input type="number" class="kv-value roboto-mono-normal" data-number />
    </template>
</html>
